<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1"></stop>
    </linearGradient>
  </defs>
  
  <rect width="120" height="120" rx="20" fill="url(#grad)"></rect>

  <!-- Calendário -->
  <rect x="25" y="30" width="70" height="60" rx="10" fill="#ffffff"></rect>
  
  <!-- Topo calendário -->
  <rect x="25" y="30" width="70" height="15" rx="10" fill="#22d3ee"></rect>

  <!-- Número 30 -->
  <text x="60" y="75" text-anchor="middle" font-size="28" font-family="Arial" fill="#0f172a" font-weight="bold">
    30
  </text>

  <!-- Código </> -->
  <text x="60" y="100" text-anchor="middle" font-size="14" font-family="Arial" fill="#ffffff">
    &lt;/&gt;
  </text>
</svg>