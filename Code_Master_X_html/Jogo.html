<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Jogo de Guerra</title>

    <style>
        body {
            background: #0d1117;
            color: white;
            font-family: Arial;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .game {
            width: 420px;
            background: #161b22;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 20px #000;
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .fighter {
            background: #1f2937;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            text-align: center;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid white;
            object-fit: cover;
            margin-bottom: 6px;
        }

        .hp-bar {
            width: 100%;
            height: 14px;
            background: #333;
            border-radius: 7px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .hp-fill {
            height: 100%;
            background: #2ecc71;
            width: 100%;
            transition: 0.3s;
        }

        .log {
            background: #111;
            height: 150px;
            overflow-y: auto;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
        }

        .atk {
            background: #e74c3c;
            color: white;
        }

        .heal {
            background: #3498db;
            color: white;
        }

        .next {
            background: #f1c40f;
            color: black;
            display: none;
        }
    </style>
</head>

<body>

    <div class="game">
        <h1>⚔️ Guerra de Equipes</h1>

        <!-- JOGADOR -->
        <div class="fighter" id="player">
            <img src="https://i.imgur.com/4AiXzf8.jpeg" class="avatar">
            <h2 id="player-name">Herói Azul</h2>
            <p id="player-weapon">Arma: Espada</p>
            <div class="hp-bar">
                <div class="hp-fill" id="player-hp"></div>
            </div>
            <p id="player-hp-text">HP: 100/100</p>
        </div>

        <!-- INIMIGO -->
        <div class="fighter" id="enemy">
            <img id="enemy-img" src="https://i.imgur.com/8RKXAIV.jpeg" class="avatar">
            <h2 id="enemy-name">Soldado Vermelho</h2>
            <p id="enemy-weapon">Arma: Lança</p>
            <div class="hp-bar">
                <div class="hp-fill" id="enemy-hp"></div>
            </div>
            <p id="enemy-hp-text">HP: 80/80</p>
        </div>

        <div class="log" id="log"></div>

        <button class="atk" onclick="atacar()">Atacar</button>
        <button class="heal" onclick="curar()">Curar</button>
        <button class="next" id="next-btn" onclick="proximoInimigo()">Próximo Inimigo</button>
    </div>

    <script>
        const armas = {
            espada: { dano: [10, 20] },
            arco: { dano: [8, 16] },
            magia: { dano: [12, 25] }
        };

        const inimigos = [
            { nome: "Soldado Vermelho", hp: 80, maxHp: 80, arma: "lança", img: "https://i.imgur.com/8RKXAIV.jpeg" },
            { nome: "Arqueiro Vermelho", hp: 90, maxHp: 90, arma: "arco", img: "https://i.imgur.com/7YV1F3P.jpeg" },
            { nome: "Mago Vermelho", hp: 120, maxHp: 120, arma: "magia", img: "https://i.imgur.com/1XKQFQ2.jpeg" }
        ];

        let player = {
            nome: "Herói Azul",
            hp: 100,
            maxHp: 100,
            arma: "espada"
        };

        let index = 0;
        let enemy = inimigos[index];

        function atualizar() {
            document.getElementById("player-hp").style.width = (player.hp / player.maxHp * 100) + "%";
            document.getElementById("player-hp-text").textContent = `HP: ${player.hp}/${player.maxHp}`;

            document.getElementById("enemy-hp").style.width = (enemy.hp / enemy.maxHp * 100) + "%";
            document.getElementById("enemy-hp-text").textContent = `HP: ${enemy.hp}/${enemy.maxHp}`;

            document.getElementById("enemy-name").textContent = enemy.nome;
            document.getElementById("enemy-weapon").textContent = "Arma: " + enemy.arma;
            document.getElementById("enemy-img").src = enemy.img;
        }

        function log(msg) {
            const box = document.getElementById("log");
            box.innerHTML += "<p>" + msg + "</p>";
            box.scrollTop = box.scrollHeight;
        }

        function rand(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function atacar() {
            const dano = rand(...armas[player.arma].dano);
            enemy.hp -= dano;
            log(`⚔️ Você atacou com ${player.arma} e causou ${dano} de dano!`);
            atualizar();

            if (enemy.hp <= 0) {
                log(`🏆 Você derrotou ${enemy.nome}!`);
                document.getElementById("next-btn").style.display = "block";
                return;
            }

            setTimeout(turnoInimigo, 600);
        }

        function turnoInimigo() {
            const dano = rand(6, 14);
            player.hp -= dano;
            log(`💥 ${enemy.nome} atacou e causou ${dano} de dano!`);
            atualizar();

            if (player.hp <= 0) {
                log("☠️ Você foi derrotado!");
            }
        }

        function curar() {
            const cura = rand(10, 20);
            player.hp = Math.min(player.maxHp, player.hp + cura);
            log(`💊 Você recuperou ${cura} de HP.`);
            atualizar();
            setTimeout(turnoInimigo, 600);
        }

        function proximoInimigo() {
            index++;
            if (index >= inimigos.length) {
                log("🎉 Você venceu todos os inimigos!");
                return;
            }

            enemy = inimigos[index];
            enemy.hp = enemy.maxHp;
            document.getElementById("next-btn").style.display = "none";
            log(`⚔️ Novo inimigo apareceu: ${enemy.nome}!`);
            atualizar();
        }

        atualizar();
    </script>

</body>

</html>
