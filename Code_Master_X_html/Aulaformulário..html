<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>

<body>

    <h1>Formulário</h1>
    <hr>
    <!--LEGENDA PARA NOME-->
    <form>
        <label for="Campo_nome">Nome:</label>
        <input id="Campo_nome" type="text" placeholder="Digite seu nome" required>
        <br><br>


        <!--CAMPO INPUT  DO TYPE EMAIL-->
        <label for="Campo_email">Email:</label>
        <input id="Campo_email" type="email" placeholder="Digite o seu  email" required>
        <br><br>


        <!--CAMPO INPUT DO TYPE PASSWORD-->
        <label for="Campo_senha">Senha:</label>
        <input id="Campo_senha" type="password" placeholder="Digite a senha" required>


        <br>

        <h2>Animal de estimação</h2>

        <input type="radio" id="dog" name="animal" value="Cachorro">
        <label for="dog">Cachorro</label>

        <br><br>

        <input type="radio" id="cat" name="animal" value="Gato">
        <label for="cat">Gato</label>

        <br><br>

        <input type="radio" id="Passaro" name="animal" value="Passsaro">
        <label for="Passaro">Passaro</label>

        <br><br>

        <h2>Quais linguagens de programação você estuda?</h2>
        <input type="checkbox" id="HTML" name="Linguagem de programação" value="HTMLL">
        <label for="HTML">HTML</label>

        <br><br>

        <input type="checkbox" id="JavaScript" name="Linguagem  de programação" value="JavaScript">
        <label for="JavaScript">JavaScript</label>

        <br><br>

        <input type="checkbox" id="Python" name="Linguagem  de programação" value="Python">
        <label for="Python">Python</label>

        <br><br>


        <input type="checkbox" id="php" name="Linguagem  de programação" value="php">
        <label for="php">PHP</label>

        <br><br>

        <input type="checkbox" id="CSS" name="Linguagem  de programação" value="CSS">
        <label for="CSS">CSS</label>

        <br><br>

        <input type="checkbox" id="Java" name="Linguagem  de programação" value="Java">
        <label for="Java">Java</label>

        <br>
        <h2>Digite sua mensagem:</h2>

        <textarea name="mensagem" placeholder="Digite aqui sua mensagem" rows="15"
            cols="20">Digite sua mensagem aqui</textarea>

        <br>
        <h2>Escolha uma cor:</h2>
        <select name="cores">
            <option selected disabled value="Escolhe uma cor">Escolhe uma cor</option>
            <option value="vermelho">vermelho</option>
            <option value="azul">azul</option>
            <option value="preto">preto</option>
            <option value="azul">azul</option>
            <br><br>


            <!--CAMPO INPUT DO TYPE SUBMIT-->
            <input type="submit" value="Enviar formulário">


    </form>
    <a href="Site001.html>
        
    </html>>Página inicial</a>

</body>

</html>
